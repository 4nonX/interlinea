# Interlinea team server on PostgreSQL.
#
#   INTERLINEA_ADMIN_PASSWORD='a long password' POSTGRES_PASSWORD='another one' docker compose up -d
#
# Then open http://localhost:8080 and sign in as "admin". Behind a reverse
# proxy with HTTPS, set INTERLINEA_PUBLIC_URL to its address and
# INTERLINEA_TRUST_PROXY=true. For sign-in with Entra ID, Google or
# Keycloak, set the INTERLINEA_OIDC_* variables (see interlinea-server -h);
# the provider's redirect address is <public URL>/api/auth/oidc/callback.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: interlinea
      POSTGRES_USER: interlinea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interlinea -d interlinea"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  server:
    build: .
    image: interlinea-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INTERLINEA_POSTGRES: postgres://interlinea:${POSTGRES_PASSWORD}@postgres:5432/interlinea?sslmode=disable
      INTERLINEA_PUBLIC_URL: ${INTERLINEA_PUBLIC_URL:-http://localhost:8080}
      INTERLINEA_TRUST_PROXY: ${INTERLINEA_TRUST_PROXY:-false}
      INTERLINEA_ADMIN_USER: ${INTERLINEA_ADMIN_USER:-admin}
      INTERLINEA_ADMIN_PASSWORD: ${INTERLINEA_ADMIN_PASSWORD:?set INTERLINEA_ADMIN_PASSWORD (12 characters or more)}
      INTERLINEA_OIDC_ISSUER: ${INTERLINEA_OIDC_ISSUER:-}
      INTERLINEA_OIDC_CLIENT_ID: ${INTERLINEA_OIDC_CLIENT_ID:-}
      INTERLINEA_OIDC_CLIENT_SECRET: ${INTERLINEA_OIDC_CLIENT_SECRET:-}
      INTERLINEA_OIDC_NAME: ${INTERLINEA_OIDC_NAME:-your organization}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres:
