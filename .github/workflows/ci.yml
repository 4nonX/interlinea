name: ci

# Every push to a branch is tested on Linux. macOS and Windows runners
# cost many times as much, so the tests run there only when the workflow is
# started by hand; the release workflow builds for all three at a tag.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: API reference is up to date
        if: runner.os == 'Linux'
        run: go run ./cmd/interlinea-apidoc -check
      - name: the apps' language lists are up to date
        if: runner.os == 'Linux'
        run: go run ./langtag/gen -check
      - name: every string of the interface is translated
        if: runner.os == 'Linux'
        run: go run ./i18n/gen -check
      - name: test
        run: go test ./...
      - name: race
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: build
        run: go build -trimpath -o bin/ ./cmd/...

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: interlinea
          POSTGRES_DB: interlinea
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTERLINEA_TEST_POSTGRES: postgres://postgres:interlinea@localhost:5432/interlinea?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet -tags postgres ./term/termdb ./tm/tmdb ./project/projectdb ./auth/authdb ./internal/pgdriver ./cmd/interlinea-server
      - name: termbases, memories and projects on PostgreSQL
        run: go test -tags postgres -count=1 -v -run 'TestRunsOnPostgres' ./term/termdb ./tm/tmdb ./project/projectdb ./auth/authdb && go test -tags postgres -count=1 ./term/termdb ./tm/tmdb ./project/projectdb ./auth/authdb
      - name: race
        run: go test -tags postgres -race -count=1 ./term/termdb ./tm/tmdb ./project/projectdb ./auth/authdb
      - name: server stores in their schemas
        run: go test -tags postgres -count=1 -v -run 'TestPostgresSchemas' ./cmd/interlinea-server

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the server image
        run: docker build --build-arg VERSION=ci -t interlinea-server:ci .
      - name: the image starts and answers
        run: |
          docker run -d --name il -p 8080:8080 -e INTERLINEA_ADMIN_USER=admin -e INTERLINEA_ADMIN_PASSWORD='a long enough password' interlinea-server:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/api/server | grep -q '"name":"Interlinea"'
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"username":"admin","password":"a long enough password"}' http://localhost:8080/api/auth/password | grep -q '"token":"il_'
          curl -fsS http://localhost:8080/ | grep -qi '<html'
          test "$(docker inspect -f '{{.State.Health.Status}}' il)" != unhealthy
      - name: server log
        if: always()
        run: docker logs il || true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: core for the browser
        working-directory: .
        run: make wasm
      # The copy of the LibreOffice dictionaries is kept between runs.
      - uses: actions/cache@v4
        with:
          path: .cache/lodict
          key: lodict-${{ hashFiles('Makefile', 'spell/shelfgen/main.go') }}
      - name: the spelling dictionaries that come with the app
        working-directory: .
        run: make dictionaries
      - name: team server for the browser tests
        working-directory: .
        run: go build -o bin/interlinea-server ./cmd/interlinea-server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: typecheck and build
        run: npm run build
      - name: browser tests
        run: npm run e2e
        env:
          INTERLINEA_SERVER: ${{ github.workspace }}/bin/interlinea-server

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libsecret-1-dev ninja-build
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - name: configure
        run: cmake -S desktop -B build/desktop -DCMAKE_BUILD_TYPE=Release
      - name: build (the app, its core and the tests)
        # A fixed number of jobs: without one, make starts them all at once
        # and the runner runs out of memory.
        run: cmake --build build/desktop --config Release --parallel 4
      - name: tests
        shell: bash
        # What a failed test said is in the log, also where the run shows
        # none of it. A run started by hand keeps what the windows looked
        # like, for checking the layout on each system.
        env:
          INTERLINEA_SCREENSHOTS: ${{ github.event_name == 'workflow_dispatch' && format('{0}/screenshots', runner.temp) || '' }}
        run: |
          if [ -n "$INTERLINEA_SCREENSHOTS" ]; then mkdir -p "$INTERLINEA_SCREENSHOTS"; fi
          ctest --test-dir build/desktop -C Release --output-on-failure || {
            # (Nothing found is no reason to stop: the step runs with -e.)
            grep -a -E "FAIL!|Loc:|Actual|Expected|QFATAL|Totals|Exception|crashed" build/desktop/Testing/Temporary/LastTest.log | head -60 || true
            # A test that crashed may have taken what it printed with it:
            # once more, writing straight to a file, with how it ended.
            "$(command -v python3 || command -v python)" desktop/tests/rerun-failed.py build/desktop Release || true
            exit 1
          }
      - name: keep the screenshots
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
      - name: the whole app against a team server
        if: runner.os == 'Linux'
        run: |
          go build -o bin/interlinea-server ./cmd/interlinea-server
          INTERLINEA_ADMIN_USER=anna INTERLINEA_ADMIN_PASSWORD='a long enough password' bin/interlinea-server -addr 127.0.0.1:18080 -data "$RUNNER_TEMP/team" &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          INTERLINEA_TEAM_SERVER=http://127.0.0.1:18080 INTERLINEA_TEAM_USER=anna INTERLINEA_TEAM_PASSWORD='a long enough password' \
            ctest --test-dir build/desktop -C Release -R endtoend --output-on-failure
