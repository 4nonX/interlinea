name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: race
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: build
        run: go build -trimpath -o bin/ ./cmd/...

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: interlinea
          POSTGRES_DB: interlinea
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTERLINEA_TEST_POSTGRES: postgres://postgres:interlinea@localhost:5432/interlinea?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet -tags postgres ./term/termdb ./tm/tmdb ./project/projectdb ./internal/pgdriver
      - name: termbases, memories and projects on PostgreSQL
        run: go test -tags postgres -count=1 -v -run 'TestRunsOnPostgres' ./term/termdb ./tm/tmdb ./project/projectdb && go test -tags postgres -count=1 ./term/termdb ./tm/tmdb ./project/projectdb
      - name: race
        run: go test -tags postgres -race -count=1 ./term/termdb ./tm/tmdb ./project/projectdb

  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: core for the browser
        working-directory: .
        run: make wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - name: typecheck and build
        run: npm run build
      - name: browser tests
        run: npm run e2e
