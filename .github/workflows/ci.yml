name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: API reference is up to date
        if: runner.os == 'Linux'
        run: go run ./cmd/interlinea-apidoc -check
      - name: the apps' language lists are up to date
        if: runner.os == 'Linux'
        run: go run ./langtag/gen -check
      - name: test
        run: go test ./...
      - name: race
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: build
        run: go build -trimpath -o bin/ ./cmd/...

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: interlinea
          POSTGRES_DB: interlinea
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTERLINEA_TEST_POSTGRES: postgres://postgres:interlinea@localhost:5432/interlinea?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet -tags postgres ./term/termdb ./tm/tmdb ./project/projectdb ./auth/authdb ./internal/pgdriver ./cmd/interlinea-server
      - name: termbases, memories and projects on PostgreSQL
        run: go test -tags postgres -count=1 -v -run 'TestRunsOnPostgres' ./term/termdb ./tm/tmdb ./project/projectdb ./auth/authdb && go test -tags postgres -count=1 ./term/termdb ./tm/tmdb ./project/projectdb ./auth/authdb
      - name: race
        run: go test -tags postgres -race -count=1 ./term/termdb ./tm/tmdb ./project/projectdb ./auth/authdb
      - name: server stores in their schemas
        run: go test -tags postgres -count=1 -v -run 'TestPostgresSchemas' ./cmd/interlinea-server

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the server image
        run: docker build --build-arg VERSION=ci -t interlinea-server:ci .
      - name: the image starts and answers
        run: |
          docker run -d --name il -p 8080:8080 -e INTERLINEA_ADMIN_USER=admin -e INTERLINEA_ADMIN_PASSWORD='a long enough password' interlinea-server:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/api/server | grep -q '"name":"Interlinea"'
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"username":"admin","password":"a long enough password"}' http://localhost:8080/api/auth/password | grep -q '"token":"il_'
          curl -fsS http://localhost:8080/ | grep -qi '<html'
          test "$(docker inspect -f '{{.State.Health.Status}}' il)" != unhealthy
      - name: server log
        if: always()
        run: docker logs il || true

  prototype:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: core for the browser
        working-directory: .
        run: make wasm
      - name: team server for the browser tests
        working-directory: .
        run: go build -o bin/interlinea-server ./cmd/interlinea-server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - name: typecheck and build
        run: npm run build
      - name: browser tests
        run: npm run e2e
        env:
          INTERLINEA_SERVER: ${{ github.workspace }}/bin/interlinea-server

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libsecret-1-dev ninja-build
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - name: configure
        run: cmake -S desktop -B build/desktop -DCMAKE_BUILD_TYPE=Release
      - name: build (the app, its core and the tests)
        run: cmake --build build/desktop --config Release --parallel
      - name: tests
        run: ctest --test-dir build/desktop -C Release --output-on-failure
      - name: the whole app against a team server
        if: runner.os == 'Linux'
        run: |
          go build -o bin/interlinea-server ./cmd/interlinea-server
          INTERLINEA_ADMIN_USER=anna INTERLINEA_ADMIN_PASSWORD='a long enough password' bin/interlinea-server -addr 127.0.0.1:18080 -data "$RUNNER_TEMP/team" &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          INTERLINEA_TEAM_SERVER=http://127.0.0.1:18080 INTERLINEA_TEAM_USER=anna INTERLINEA_TEAM_PASSWORD='a long enough password' \
            ctest --test-dir build/desktop -C Release -R endtoend --output-on-failure
