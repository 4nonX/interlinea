# Builds what people install and attaches it to a release.
#
# A tag v1.2.3 makes release 1.2.3: the server image on the GitHub
# container registry, the server and the command line tool for Linux,
# macOS and Windows, the web client, and the desktop app as a Windows
# installer, a macOS disk image and a Linux AppImage. The release takes
# its notes from the version's section of CHANGELOG.md.
#
# Started by hand, it builds everything for a version without tagging or
# releasing, to try the packaging: the files are attached to the run.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without making a release
        default: 0.0.0-test

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GIVEN: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            # A release needs its notes.
            awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1} END {exit !found}' CHANGELOG.md \
              || { echo "CHANGELOG.md has no section for $version"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            version="$GIVEN"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The spelling dictionaries that come with Interlinea, fetched once for
  # all packages. The image fetches its own (see Dockerfile).
  dictionaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make dictionaries
      - uses: actions/upload-artifact@v4
        with:
          name: dictionaries
          path: web/public/dictionaries
          if-no-files-found: error
          retention-days: 1

  server:
    needs: [version, dictionaries]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: dictionaries
          path: web/public/dictionaries
      - name: the web client, with the core for the browser and the dictionaries
        run: |
          make wasm
          cd web
          npm ci
          npm run build
      - name: the server and the command line tool, for every system
        run: |
          mkdir -p out
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            system="$os"; [ "$os" = darwin ] && system=macos
            name="interlinea-server-$VERSION-$system-$arch"
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "stage/$name"
            for cmd in interlinea-server interlinea; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=$VERSION" -o "stage/$name/$cmd$ext" "./cmd/$cmd"
            done
            cp -r web/dist "stage/$name/web"
            cp README.md CHANGELOG.md LICENSE NOTICE docs/running.md "stage/$name/"
            if [ "$os" = windows ]; then
              (cd stage && zip -qr "../out/$name.zip" "$name")
            else
              tar -C stage -czf "out/$name.tar.gz" "$name"
            fi
          done
          (cd web/dist && zip -qr "../../out/interlinea-web-$VERSION.zip" .)
          ls -l out
      - name: the server starts and serves the web client
        run: |
          tar -xzf "out/interlinea-server-$VERSION-linux-amd64.tar.gz"
          cd "interlinea-server-$VERSION-linux-amd64"
          INTERLINEA_ADMIN_USER=admin INTERLINEA_ADMIN_PASSWORD='a long enough password' \
            ./interlinea-server -addr 127.0.0.1:18080 -data "$RUNNER_TEMP/data" -web web &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/ | grep -qi '<!doctype html'
          curl -fsS http://127.0.0.1:18080/api/server | grep -q "\"$VERSION\""
          curl -fsS http://127.0.0.1:18080/dictionaries/index.json | grep -q '"de_DE_frami"'
          ./interlinea version | grep -q "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: out/*
          if-no-files-found: error

  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/interlinea-server" >> "$GITHUB_OUTPUT"
      - name: the image starts and answers, before it goes anywhere
        run: |
          docker buildx build --load --build-arg "VERSION=$VERSION" -t interlinea-server:try .
          docker run -d --name try -p 18080:8080 -e INTERLINEA_ADMIN_USER=admin -e INTERLINEA_ADMIN_PASSWORD='a long enough password' interlinea-server:try
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/api/server | grep -q "\"$VERSION\""
          curl -fsS http://127.0.0.1:18080/ | grep -qi '<!doctype html'
          curl -fsS http://127.0.0.1:18080/dictionaries/index.json | grep -q '"de_DE_frami"'
          docker logs try 2>&1 | grep -q "spelling dictionaries included"
          docker rm -f try
      - uses: docker/build-push-action@v6
        env:
          # No record of the build among the run's artifacts.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.version.outputs.release == 'true' }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ needs.version.outputs.version }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=Interlinea team server
            org.opencontainers.image.description=The Interlinea team server with the web client
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  desktop-linux:
    needs: [version, dictionaries]
    # The oldest supported Ubuntu: an AppImage runs on systems as new as
    # the one it was built on, or newer.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: dictionaries
          path: web/public/dictionaries
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libsecret-1-dev ninja-build libfuse2 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - name: build
        run: |
          cmake -S desktop -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DINTERLINEA_VERSION="$VERSION"
          cmake --build build/desktop --parallel 4 --target interlinea interlinea_core
      - name: AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp build/desktop/Interlinea build/desktop/interlinea-core AppDir/usr/bin/
          cp desktop/packaging/dev.interlinea.Interlinea.desktop AppDir/usr/share/applications/
          cp desktop/packaging/interlinea.png AppDir/usr/share/icons/hicolor/512x512/apps/
          mkdir -p AppDir/usr/share/doc/interlinea AppDir/usr/share/interlinea
          cp LICENSE NOTICE AppDir/usr/share/doc/interlinea/
          cp -r build/desktop/dictionaries AppDir/usr/share/interlinea/
          base=https://github.com/linuxdeploy
          curl -fsSL -o linuxdeploy "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-qt "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export QMAKE="$(which qmake6 || which qmake)"
          # The QML the interface imports, so the Qt Quick modules go in.
          export QML_SOURCES_PATHS="$PWD/desktop/qml"
          export LINUXDEPLOY_OUTPUT_VERSION="$VERSION"
          export OUTPUT="Interlinea-$VERSION-linux-x86_64.AppImage"
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
            --desktop-file AppDir/usr/share/applications/dev.interlinea.Interlinea.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/interlinea.png
          ls -l "$OUTPUT"
      - name: the packed app starts, with its core
        run: |
          app="$PWD/Interlinea-$VERSION-linux-x86_64.AppImage"
          "$app" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/interlinea-core
          test -f squashfs-root/usr/share/interlinea/dictionaries/index.json
          # Every library the app needs is found.
          ! (cd squashfs-root && LD_LIBRARY_PATH=usr/lib ldd usr/bin/Interlinea | grep "not found")
          QT_QPA_PLATFORM=offscreen INTERLINEA_DATA="$RUNNER_TEMP/data" timeout 15 "$app" & pid=$!
          sleep 8
          kill -0 "$pid"
          pgrep -f interlinea-core
          kill "$pid" || true
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: Interlinea-*.AppImage
          if-no-files-found: error

  desktop-windows:
    needs: [version, dictionaries]
    runs-on: windows-latest
    # Signing goes through SignPath (docs/signing.md), which reads the files
    # to sign from this run's artifacts.
    permissions:
      contents: read
      actions: read
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Set once the SignPath project is there; without it nothing is signed.
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: dictionaries
          path: web/public/dictionaries
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - name: build
        run: |
          cmake -S desktop -B build/desktop -DCMAKE_BUILD_TYPE=Release "-DINTERLINEA_VERSION=$env:VERSION"
          cmake --build build/desktop --config Release --parallel 4 --target interlinea interlinea_core
      - name: the app with the Qt it needs
        run: |
          New-Item -ItemType Directory -Force stage/Interlinea | Out-Null
          Copy-Item build/desktop/Release/Interlinea.exe, build/desktop/Release/interlinea-core.exe stage/Interlinea/
          Copy-Item -Recurse build/desktop/Release/dictionaries stage/Interlinea/
          windeployqt --release --compiler-runtime --no-system-d3d-compiler --no-opengl-sw --qmldir desktop/qml stage/Interlinea/Interlinea.exe
          Copy-Item README.md, CHANGELOG.md, LICENSE, NOTICE stage/Interlinea/
      # The app and its core are signed before they go into the installer
      # and the portable zip, and the installer after it is made.
      - name: the programs to sign
        if: env.SIGN == 'true'
        id: unsigned-programs
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-programs
          path: |
            stage/Interlinea/Interlinea.exe
            stage/Interlinea/interlinea-core.exe
          if-no-files-found: error
      - name: sign the programs
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned-programs.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-programs
      - name: the signed programs in place
        if: env.SIGN == 'true'
        run: |
          Copy-Item -Force signed-programs/Interlinea.exe, signed-programs/interlinea-core.exe stage/Interlinea/
          foreach ($f in "stage/Interlinea/Interlinea.exe", "stage/Interlinea/interlinea-core.exe") {
            $s = Get-AuthenticodeSignature $f
            if ($s.Status -ne "Valid") { throw "$f is not signed: $($s.StatusMessage)" }
          }
      - name: the staged app starts, with its core
        shell: bash
        run: |
          INTERLINEA_DATA="$RUNNER_TEMP/data" stage/Interlinea/Interlinea.exe & pid=$!
          sleep 12
          tasklist | grep -i "Interlinea.exe"
          tasklist | grep -i "interlinea-core.exe"
          taskkill //F //IM Interlinea.exe || true
          taskkill //F //IM interlinea-core.exe || true
      - name: installer and portable folder
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\stage\Interlinea" "/DOutputDir=$PWD\out" desktop\packaging\interlinea.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path stage/Interlinea -DestinationPath "out/Interlinea-$env:VERSION-windows-x64-portable.zip"
          Get-ChildItem out
      - name: the installer to sign
        if: env.SIGN == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: out/Interlinea-${{ env.VERSION }}-windows-x64-setup.exe
          if-no-files-found: error
      - name: sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup
      - name: the signed installer in place
        id: signed
        shell: pwsh
        run: |
          $setup = "out/Interlinea-$env:VERSION-windows-x64-setup.exe"
          if ($env:SIGN -eq "true") {
            Copy-Item -Force "signed-setup/Interlinea-$env:VERSION-windows-x64-setup.exe" $setup
            $s = Get-AuthenticodeSignature $setup
            if ($s.Status -ne "Valid") { throw "$setup is not signed: $($s.StatusMessage)" }
            "signed=true" >> $env:GITHUB_OUTPUT
          } else {
            "signed=false" >> $env:GITHUB_OUTPUT
          }
      - name: the installer installs, and what it installed starts
        shell: bash
        run: |
          "out/Interlinea-$VERSION-windows-x64-setup.exe" //VERYSILENT //SUPPRESSMSGBOXES //CURRENTUSER //NORESTART "//DIR=$(cygpath -w "$RUNNER_TEMP/installed")" //LOG="$(cygpath -w "$RUNNER_TEMP/setup.log")"
          test -f "$RUNNER_TEMP/installed/Interlinea.exe"
          test -f "$RUNNER_TEMP/installed/interlinea-core.exe"
          test -f "$RUNNER_TEMP/installed/dictionaries/index.json"
          test -f "$RUNNER_TEMP/installed/unins000.exe"
          INTERLINEA_DATA="$RUNNER_TEMP/data2" "$RUNNER_TEMP/installed/Interlinea.exe" & sleep 12
          tasklist | grep -i "interlinea-core.exe"
          taskkill //F //IM Interlinea.exe || true
          taskkill //F //IM interlinea-core.exe || true
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: out/*
          if-no-files-found: error

  desktop-macos:
    needs: [version, dictionaries]
    runs-on: macos-latest
    outputs:
      notarized: ${{ steps.dmg.outputs.notarized }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Set once the Developer ID certificate and the notary sign-in are
      # secrets (docs/signing.md); without them the app is signed for the
      # computer only.
      SIGN: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: dictionaries
          path: web/public/dictionaries
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - name: build, for Apple and Intel processors
        run: |
          cmake -S desktop -B build/desktop -DCMAKE_BUILD_TYPE=Release -DINTERLINEA_VERSION="$VERSION" \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build/desktop --parallel 4 --target interlinea interlinea_core
          # The core for both processors, in one file.
          app=build/desktop/Interlinea.app
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "core-$arch" ./cmd/interlinea-core
          done
          lipo -create -output "$app/Contents/MacOS/interlinea-core" core-arm64 core-amd64
          lipo -archs "$app/Contents/MacOS/Interlinea" | grep -q x86_64
          lipo -archs "$app/Contents/MacOS/Interlinea" | grep -q arm64
          test -f "$app/Contents/Resources/dictionaries/index.json"
      - name: the Developer ID certificate, in a keychain of its own
        if: env.SIGN == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass="$(openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -m1 "Developer ID Application" | sed -E 's/.*"(.*)"/\1/')"
          test -n "$identity" || { echo "the certificate is no Developer ID Application certificate"; exit 1; }
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: disk image
        id: dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          app=build/desktop/Interlinea.app
          macdeployqt "$app" -qmldir=desktop/qml
          cp LICENSE NOTICE "$app/Contents/Resources/"
          dmg="out/Interlinea-$VERSION-macos-universal.dmg"
          if [ "$SIGN" = true ]; then
            # From the inside out, with the hardened runtime and a timestamp,
            # as notarization asks.
            sign() { codesign --force --options runtime --timestamp --sign "$IDENTITY" "$@"; }
            find "$app/Contents" \( -name "*.dylib" -o -name "*.so" \) -type f -print0 | while IFS= read -r -d '' f; do sign "$f"; done
            for fw in "$app"/Contents/Frameworks/*.framework; do [ -e "$fw" ] && sign "$fw"; done
            sign "$app/Contents/MacOS/interlinea-core"
            sign "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
          else
            # Signed for this computer only: there is no developer certificate.
            codesign --force --deep --sign - "$app"
            codesign --verify --deep "$app"
          fi
          mkdir -p dmg out
          cp -R "$app" dmg/
          cp LICENSE dmg/LICENSE.txt
          cp NOTICE dmg/NOTICE.txt
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Interlinea $VERSION" -srcfolder dmg -ov -format UDZO "$dmg"
          if [ "$SIGN" = true ]; then
            codesign --force --timestamp --sign "$IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --timeout 30m
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose "$dmg"
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi
      - name: the app from the disk image starts, with its core
        run: |
          hdiutil attach "out/Interlinea-$VERSION-macos-universal.dmg" -mountpoint /Volumes/InterlineaTry -nobrowse
          cp -R /Volumes/InterlineaTry/Interlinea.app "$RUNNER_TEMP/"
          hdiutil detach /Volumes/InterlineaTry
          INTERLINEA_DATA="$RUNNER_TEMP/data" "$RUNNER_TEMP/Interlinea.app/Contents/MacOS/Interlinea" & pid=$!
          sleep 10
          kill -0 "$pid"
          pgrep -f interlinea-core
          kill "$pid" || true
      - name: the signing keychain removed
        if: always() && env.SIGN == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: out/*
          if-no-files-found: error

  release:
    needs: [version, server, image, desktop-linux, desktop-windows, desktop-macos]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      WINDOWS_SIGNED: ${{ needs.desktop-windows.outputs.signed }}
      MACOS_NOTARIZED: ${{ needs.desktop-macos.outputs.notarized }}
    steps:
      - uses: actions/checkout@v4
      # Only what the jobs above built: the image job also leaves a
      # record of its build among the artifacts, which is no file of the
      # release and does not download like one.
      - uses: actions/download-artifact@v4
        with:
          name: server
          path: files
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: files
          merge-multiple: true
      - name: checksums and notes
        run: |
          (cd files && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          # The version's section of the changelog, without its heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[[^]]+\]: / {next}
            on {print}' CHANGELOG.md > notes.md
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          # What the first start asks, as far as the files are not signed.
          windows_first=""
          [ "$WINDOWS_SIGNED" = true ] || windows_first=" It is not signed yet, so SmartScreen may stop it the first time: More info, then Run anyway."
          mac_first=""
          [ "$MACOS_NOTARIZED" = true ] || mac_first=" The app is not notarized by Apple yet, so the first start is refused: open System Settings, Privacy & Security, and click Open Anyway."
          cat >> notes.md <<EOF

          ## Installing

          **Team server, with Docker:** \`docker pull ghcr.io/$owner/interlinea-server:$VERSION\`, or \`compose.yaml\` from the repository for the server on PostgreSQL. Without Docker, unpack \`interlinea-server-$VERSION-<system>\` and start \`interlinea-server -web web\`.

          **Desktop app:** Windows: \`Interlinea-$VERSION-windows-x64-setup.exe\` (or the portable folder).$windows_first macOS: \`Interlinea-$VERSION-macos-universal.dmg\`.$mac_first Linux: make \`Interlinea-$VERSION-linux-x86_64.AppImage\` executable and start it. Help with installing: https://interlinea.dev/docs/help/install/

          **Web client alone:** \`interlinea-web-$VERSION.zip\` is the client as static files, for any web server.

          \`SHA256SUMS\` has the checksums of all files. Setting up a server is described in docs/running.md.
          EOF
          sed -i 's/^          //' notes.md
          cat notes.md
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$VERSION" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" files/* --title "Interlinea $VERSION" --notes-file notes.md $pre
